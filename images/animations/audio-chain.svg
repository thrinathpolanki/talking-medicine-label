<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" font-family="Helvetica, Arial, sans-serif"><title>Audio path animation</title><desc>Audio flows from microSD through the DFPlayer Mini DAC outputs to the PAM8403 and then to the left and right speakers.</desc><rect width="1000" height="250" fill="#ffffff"/><text x="500" y="30" font-size="20" fill="#0B2545" text-anchor="middle" font-weight="700">Audio path</text><rect x="40" y="100" width="140" height="90" rx="10" fill="#0B2545"/><text x="110.0" y="143.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">microSD</text><text x="110.0" y="161.0" font-size="11" fill="#bfe9e5" text-anchor="middle">/01 /02 /99</text><rect x="240" y="100" width="160" height="90" rx="10" fill="#0B2545"/><text x="320.0" y="143.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">DFPlayer Mini</text><text x="320.0" y="161.0" font-size="11" fill="#bfe9e5" text-anchor="middle">DAC_L, DAC_R</text><rect x="470" y="100" width="160" height="90" rx="10" fill="#0B2545"/><text x="550.0" y="143.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">PAM8403</text><text x="550.0" y="161.0" font-size="11" fill="#bfe9e5" text-anchor="middle">HW-104, BTL</text><rect x="780" y="40" width="170" height="60" rx="10" fill="#0B2545"/><text x="865.0" y="68.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">Speaker L</text><text x="865.0" y="86.0" font-size="11" fill="#bfe9e5" text-anchor="middle">L+ / L-</text><rect x="780" y="160" width="170" height="60" rx="10" fill="#0B2545"/><text x="865.0" y="188.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">Speaker R</text><text x="865.0" y="206.0" font-size="11" fill="#bfe9e5" text-anchor="middle">R+ / R-</text><line x1="180" y1="145" x2="240" y2="145" stroke="#888" stroke-width="4" stroke-linecap="round"/><line x1="400" y1="125" x2="470" y2="125" stroke="#7B1FA2" stroke-width="4" stroke-linecap="round"/><line x1="400" y1="165" x2="470" y2="165" stroke="#AB47BC" stroke-width="4" stroke-linecap="round"/><line x1="630" y1="125" x2="700" y2="125" stroke="#607D8B" stroke-width="4" stroke-linecap="round"/><line x1="700" y1="125" x2="700" y2="70" stroke="#607D8B" stroke-width="4" stroke-linecap="round"/><line x1="700" y1="70" x2="780" y2="70" stroke="#607D8B" stroke-width="4" stroke-linecap="round"/><line x1="630" y1="165" x2="700" y2="165" stroke="#607D8B" stroke-width="4" stroke-linecap="round"/><line x1="700" y1="165" x2="700" y2="190" stroke="#607D8B" stroke-width="4" stroke-linecap="round"/><line x1="700" y1="190" x2="780" y2="190" stroke="#607D8B" stroke-width="4" stroke-linecap="round"/><circle r="6" fill="#888" opacity="0"><animateMotion dur="6.0s" repeatCount="indefinite" path="M180,145 L240,145" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1417;1" calcMode="linear"/><animate attributeName="opacity" dur="6.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0010;0.1417;0.1427;1"/></circle><circle r="6" fill="#7B1FA2" opacity="0"><animateMotion dur="6.0s" repeatCount="indefinite" path="M400,125 L470,125" keyPoints="0;0;1;1" keyTimes="0;0.1667;0.3083;1" calcMode="linear"/><animate attributeName="opacity" dur="6.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1667;0.1677;0.3083;0.3093;1"/></circle><circle r="6" fill="#AB47BC" opacity="0"><animateMotion dur="6.0s" repeatCount="indefinite" path="M400,165 L470,165" keyPoints="0;0;1;1" keyTimes="0;0.1667;0.3083;1" calcMode="linear"/><animate attributeName="opacity" dur="6.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1667;0.1677;0.3083;0.3093;1"/></circle><circle r="6" fill="#607D8B" opacity="0"><animateMotion dur="6.0s" repeatCount="indefinite" path="M630,125 L700,125 L700,70 L780,70" keyPoints="0;0;1;1" keyTimes="0;0.5000;0.6417;1" calcMode="linear"/><animate attributeName="opacity" dur="6.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5010;0