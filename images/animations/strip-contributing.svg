<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" font-family="Helvetica, Arial, sans-serif"><title>Contributing header animation</title><desc>Help improve the build, the docs and the audio. Decorative animated header.</desc><rect width="1200" height="130" fill="#0B2545"/><text x="40" y="62" font-size="36" fill="#fff" text-anchor="start" font-weight="700">Contributing</text><text x="40" y="98" font-size="16" fill="#bfe9e5" text-anchor="start">Help improve the build, the docs and the audio</text><circle cx="1090" cy="65" r="8" fill="none" stroke="#13A89E" stroke-width="3"><animate attributeName="r" values="8;55" dur="3.0s" begin="0.00s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="3.0s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="1090" cy="65" r="8" fill="none" stroke="#13A89E" stroke-width="3"><animate attributeName="r" values="8;55" dur="3.0s" begin="1.00s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="3.0s" begin="1.00s" repeatCount="indefinite"/></circle><circle cx="1090" cy="65" r="8" fill="none" stroke="#13A89E" stroke-width="3"><animate attributeName="r" values="8;55" dur="3.0s" begin="2.00s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="3.0s" begin="2.00s" repeatCount="indefinite"/></circle><circle cx="1090" cy="65" r="9" fill="#13A89E"/><rect x="0" y="118" width="1200" height="12" fill="#13A89E"/><rect x="0" y="118" width="200" height="12" fill="#fff" opacity="0.65"><animate attributeName="x" values="-200;1200" dur="4s" repeatCount="indefinite"/></rect></svg>
