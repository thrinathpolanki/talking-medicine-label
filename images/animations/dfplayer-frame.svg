ndefinite" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2120;0.3000;0.3120;1"/></g><rect x="459" y="84" width="72" height="64" rx="8" fill="#7B1FA2" stroke="none" stroke-width="0" fill-opacity="0.18"/><rect x="459" y="84" width="72" height="64" rx="8" fill="none" stroke="#7B1FA2" stroke-width="3" /><line x1="463" y1="160" x2="527" y2="160" stroke="#7B1FA2" stroke-width="5" stroke-linecap="round" /><text x="495.0" y="204" font-size="13" fill="#7B1FA2" text-anchor="middle" font-weight="700" >Command</text><g opacity="0"><rect x="457" y="82" width="76" height="68" rx="8" fill="#7B1FA2" stroke="none" stroke-width="0" fill-opacity="0.35"/><rect x="457" y="82" width="76" height="68" rx="8" fill="none" stroke="#7B1FA2" stroke-width="6" /><animate attributeName="opacity" dur="21.8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3000;0.3120;0.4000;0.4120;1"/></g><g opacity="0"><text x="600.0" y="250" font-size="18" fill="#7B1FA2" text-anchor="middle" font-weight="700" >Byte: Command</text><text x="600.0" y="280" font-size="15" fill="#222" text-anchor="middle" >0x0F = play a track in a folder (folder 01-99, track 001-255)</text><animate attributeName="opacity" dur="21.8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3000;0.3120;0.4000;0.4120;1"/></g><rect x="529" y="84" width="72" height="64" rx="8" fill="#C0392B" stroke="none" stroke-width="0" fill-opacity="0.18"/><rect x="529" y="84" width="72" height="64" rx="8" fill="none" stroke="#C0392B" stroke-width="3" /><line x1="533" y1="160" x2="597" y2="160" stroke="#C0392B" stroke-width="5" stroke-linecap="round" /><text x="565.0" y="184" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="700" >Feedback</text><g opacity="0"><rect x="527" y="82" width="76" height="68" rx="8" fill="#C0392B" stroke="none" stroke-width="0" fill-opacity="0.35"/><rect x="527" y="82" width="76" height="68" rx="8" fill="none" stroke="#C0392B" stroke-width="6" /><animate attributeName="opacity" dur="21.8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4000;0.4120;0.5000;0.5120;1"/></g><g opacity="0"><text x="600.0" y="250" font-size="18" fill="#C0392B" text-anchor="middle" font-weight="700" >Byte: Feedback</text><text x="600.0" y="280" font-size="15" fill="#222" text-anchor="middle" >0x01 = ask the module to acknowledge (the firmware begins with isACK = true)</text><animate attributeName="opacity" dur="21.8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4000;0.4120;0.5000;0.5120;1"/></g><rect x="599" y="84" width="72" height="64" rx="8" fill="#2E7D32" stroke="none" stroke-width="0" fill-opacity="0.18"/><rect x="599" y="84" width="72" height="64" rx="8" fill="none" stroke="#2E7D32" stroke-width="3" /><line x1="603" y1="160" x2="667" y2="160" stroke="#2E7D32" stroke-width="5" stroke-linecap="round" /><text x="635.0" y="204" font-size="13" fill="#2E7D32" text-anchor="middle" font-weight="700" >Param high</text><g opacity="0"><rect x="597" y="82" width="76" height="68" rx="8" fill="#2E7D32" stroke="none" stroke-width="0" fill-opacity="0.35"/><rect x="597" y="82" width="76" height="68" rx="8" fill="none" stroke="#2E7D32" stroke-width="6" /><animate attributeName="opacity" dur="21.8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5120;0.6000;0.6120;1"/></g><g opacity="0"><text x="600.0" y="250" font-size="18" fill="#2E7D32" text-anchor="middle" font-weight="700" >Byte: Param high</text><text x="600.0" y="280" font-size="15" fill="#222" text-anchor="middle" >0x02 = folder 02 (Telugu)</text><animate attributeName="opacity" dur="21.8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5120;0.6000;0.6120;1"/></g><rect x="669" y="84" width="72" height="64" rx="8" fill="#B8860B" stroke="none" stroke-width="0" fill-opacity="0.18"/><rect x="669" y="84" width="72" height="64" rx="8" fill="none" stroke="#B8860B" stroke-width="3" /><line x1="673" y1="160" x2="737" y2="160" stroke="#B8860B" stroke-width="5" stroke-linecap="round" /><text x="705.0" y="184" font-size="13" fill="#B8860B" text-anchor="middle" font-weight="700" >Param low</text><g opacity="0"><rect x="667" y="82" width="76" height="68" rx="8" fill="#B8860B" stroke="none" stroke-width="0" fill-opacity="0.35"/><rect x="667" y="82" width="76" height="68" rx="8" fill="none" stroke="#B8860B" stroke-width="6" /><animate attributeName="opacity" dur="21.8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6000;0.6120;0.7000;0.7120;1"/></g><g opacity="0"><text x="600.0" y="250" font-size="18" fill="#B8860B" text-anchor="middle" font-weight="700" >Byte: Param low</text><text x="600.0" y="280" font-size="15" fill="#222" text-anchor="middle" >0x07 = file 007.mp3 (medicine ID 7)</text><animate attributeName="opacity" dur="21.8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6000;0.6120;0.7000;0.7120;1"/></g><rect x="739" y="84" width="142" height="64" rx="8" fill="#607D8B" stroke="none" stroke-width="0" fill-opacity="0.18"/><rect x="739" y="84" width="142" height="64" rx="8" fill="none" stroke="#607D8B" stroke-width="3" /><line x1="743" y1="160" x2="877" y2="160" stroke="#607D8B" stroke-width="5" stroke-linecap="round" /><text x="810.0" y="204" font-size="13" fill="#607D8B" text-anchor="middle" font-weight="700" >Checksum</text><g opacity="0"><rect x="737" y="82" width="146" height="68" rx="8" fill="#607D8B" stroke="none" stroke-width="0" fill-opacity="0.35"/><rect x="737" y="82" width="146" height="68" rx="8" fill="none" stroke="#607D8B" stroke-width="6" /><animate attributeName="opacity" dur="21.8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7000;0.7120;0.8000;0.8120;1"/></g><g opacity="0"><text x="600.0" y="250" font-size="18" fill="#607D8B" text-anchor="middle" font-weight="700" >Byte: Checksum</text><text x="600.0" y="280" font-size="15" fill="#222" text-anchor="middle" >FE E2 = 0x10000 - (FF+06+0F+01+02+07 = 0x11E) = 0xFEE2</text><animate attributeName="opacity" dur="21.8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7000;0.7120;0.8000;0.8120;1"/></g><rect x="879" y="84" width="72" height="64" rx="8" fill="#6D4C41" stroke="none" stroke-width="0" fill-opacity="0.18"/><rect x="879" y="84" width="72" height="64" rx="8" fill="none" stroke="#6D4C41" stroke-width="3" /><line x1="883" y1="160" x2="947" y2="160" stroke="#6D4C41" stroke-width="5" stroke-linecap="round" /><text x="915.0" y="184" font-size="13" fill="#6D4C41" text-anchor="middle" font-weight="700" >End</text><g opacity="0"><rect x="877" y="82" width="76" height="68" rx="8" fill="#6D4C41" stroke="none" stroke-width="0" fill-opacity="0.35"/><rect x="877" y="82" width="76" height="68" rx="8" fill="none" stroke="#6D4C41" stroke-width="6" /><animate attributeName="opacity" dur="21.8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8000;0.8120;0.9000;0.9120;1"/></g><g opacity="0"><text x="600.0" y="250" font-size="18" fill="#6D4C41" text-anchor="middle" font-weight="700" >Byte: End</text><text x="600.0" y="280" font-size="15" fill="#222" text-anchor="middle" >0xEF ends the frame</text><animate attributeName="opacity" dur="21.8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8000;0.8120;0.9000;0.9120;1"/></g><text x="60" y="325" font-size="14" fill="#0B2545" text-anchor="start" font-weight="700" >All fields (static reference):</text><text x="60" y="349" font-size="12" fill="#333" text-anchor="start" >Start: 0x7E starts every frame</text><text x="60" y="369" font-size="12" fill="#333" text-anchor="start" >Version: 0xFF fixed version byte</text><text x="60" y="389" font-size="12" fill="#333" text-anchor="start" >Length: 0x06 = six bytes follow before the checksum (version excluded count per manual)</text><text x="60" y="409" font-size="12" fill="#333" text-anchor="start" >Command: 0x0F = play a track in a folder (folder 01-99, track 001-255)</text><text x="60" y="429" font-size="12" fill="#333" text-anchor="start" >Feedback: 0x01 = ask the module to acknowledge (the firmware begins with isACK = true)</text><text x="60" y="449" font-size="12" fill="#333" text-anchor="start" >Param high: 0x02 = folder 02 (Telugu)</text><text x="60" y="469" font-size="12" fill="#333" text-anchor="start" >Param low: 0x07 = file 007.mp3 (medicine ID 7)</text><text x="60" y="489" font-size="12" fill="#333" text-anchor="start" >Checksum: FE E2 = 0x10000 - (FF+06+0F+01+02+07 = 0x11E) = 0xFEE2</text><text x="60" y="509" font-size="12" fill="#333" text-anchor="start" >End: 0xEF ends the frame</text><text x="600.0" y="555" font-size="12" fill="#555" text-anchor="middle" >10 bytes x 10 bits per byte / 9600 baud = 10.4 ms on the wire. Volume 9 example: 7E FF 06 06 01 00 09 FE EB EF.</text></svg>
