<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Helvetica, Arial, sans-serif"><title>Sequence diagram animation</title><desc>Nine messages appear in order between tag, PN532, ESP32, DFPlayer Mini and amplifier with speakers.</desc><rect width="1200" height="640" fill="#fff"/><text x="600" y="34" font-size="20" fill="#0B2545" text-anchor="middle" font-weight="700" >One tap, step by step (sequence diagram)</text><rect x="30" y="56" width="160" height="40" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="110" y="82" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" >NFC tag</text><line x1="110" y1="96" x2="110" y2="610" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="260" y="56" width="160" height="40" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="340" y="82" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" >PN532</text><line x1="340" y1="96" x2="340" y2="610" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="490" y="56" width="160" height="40" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="570" y="82" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" >ESP32</text><line x1="570" y1="96" x2="570" y2="610" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="720" y="56" width="160" height="40" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="800" y="82" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" >DFPlayer Mini</text><line x1="800" y1="96" x2="800" y2="610" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="960" y="56" width="160" height="40" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="1040" y="82" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" >PAM8403 + speakers</text><line x1="1040" y1="96" x2="1040" y2="610" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><g opacity="1"><line x1="110" y1="152" x2="340" y2="152" stroke="#13A89E" stroke-width="3" stroke-linecap="round" /><polygon points="340,152 328,145 328,159" fill="#13A89E"/><text x="225.0" y="142" font-size="13" fill="#222" text-anchor="middle" >Tag enters the 13.56 MHz field</text><text x="30" y="156" font-size="13" fill="#0B2545" text-anchor="start" font-weight="700" >1</text><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.0000;0.0120;0.95;1"/></g><circle r="6" fill="#13A89E" opacity="0"><animateMotion dur="16.0s" repeatCount="indefinite" path="M110,152 L340,152" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0500;1" calcMode="linear"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0010;0.0500;0.0510;1"/></circle><g opacity="1"><line x1="570" y1="206" x2="340" y2="206" stroke="#1E88E5" stroke-width="3" stroke-linecap="round" /><polygon points="340,206 352,199 352,213" fill="#1E88E5"/><text x="455.0" y="196" font-size="13" fill="#222" text-anchor="middle" >poll: InListPassiveTarget (I2C 0x24)</text><text x="30" y="210" font-size="13" fill="#0B2545" text-anchor="start" font-weight="700" >2</text><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.1000;0.1120;0.95;1"/></g><circle r="6" fill="#1E88E5" opacity="0"><animateMotion dur="16.0s" repeatCount="indefinite" path="M570,206 L340,206" keyPoints="0;0;1;1" keyTimes="0;0.1000;0.1500;1" calcMode="linear"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1000;0.1010;0.1500;0.1510;1"/></circle><g opacity="1"><line x1="340" y1="260" x2="570" y2="260" stroke="#EF6C00" stroke-width="3" stroke-linecap="round" /><polygon points="570,260 558,253 558,267" fill="#EF6C00"/><text x="455.0" y="250" font-size="13" fill="#222" text-anchor="middle" >UID (7 bytes) ready: IRQ goes low</text><text x="30" y="264" font-size="13" fill="#0B2545" text-anchor="start" font-weight="700" >3</text><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.2000;0.2120;0.95;1"/></g><circle r="6" fill="#EF6C00" opacity="0"><animateMotion dur="16.0s" repeatCount="indefinite" path="M340,260 L570,260" keyPoints="0;0;1;1" keyTimes="0;0.2000;0.2500;1" calcMode="linear"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2010;0.2500;0.2510;1"/></circle><g opacity="1"><line x1="570" y1="314" x2="340" y2="314" stroke="#1E88E5" stroke-width="3" stroke-linecap="round" /><polygon points="340,314 352,307 352,321" fill="#1E88E5"/><text x="455.0" y="304" font-size="13" fill="#222" text-anchor="middle" >read pages 4-19 (64 bytes of user memory)</text><text x="30" y="318" font-size="13" fill="#0B2545" text-anchor="start" font-weight="700" >4</text><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.3000;0.3120;0.95;1"/></g><circle r="6" fill="#1E88E5" opacity="0"><animateMotion dur="16.0s" repeatCount="indefinite" path="M570,314 L340,314" keyPoints="0;0;1;1" keyTimes="0;0.3000;0.3500;1" calcMode="linear"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3000;0.3010;0.3500;0.3510;1"/></circle><g opacity="1"><line x1="340" y1="368" x2="570" y2="368" stroke="#1E88E5" stroke-width="3" stroke-linecap="round" /><polygon points="570,368 558,361 558,375" fill="#1E88E5"/><text x="455.0" y="358" font-size="13" fill="#222" text-anchor="middle" >NDEF bytes returned</text><text x="30" y="372" font-size="13" fill="#0B2545" text-anchor="start" font-weight="700" >5</text><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.4000;0.4120;0.95;1"/></g><circle r="6" fill="#1E88E5" opacity="0"><animateMotion dur="16.0s" repeatCount="indefinite" path="M340,368 L570,368" keyPoints="0;0;1;1" keyTimes="0;0.4000;0.4500;1" calcMode="linear"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4000;0.4010;0.4500;0.4510;1"/></circle><g opacity="1"><path d="M570,410 h46 v22 h-46" fill="none" stroke="#222" stroke-width="3"/><polygon points="570,432 580,426 580,438" fill="#222"/><text x="626" y="424" font-size="13" fill="#222" text-anchor="start" >validate: Text record, TML:007, language known</text><text x="30" y="426" font-size="13" fill="#0B2545" text-anchor="start" font-weight="700" >6</text><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.5000;0.5120;0.95;1"/></g><g opacity="1"><line x1="570" y1="476" x2="800" y2="476" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" /><polygon points="800,476 788,469 788,483" fill="#2E7D32"/><text x="685.0" y="466" font-size="13" fill="#222" text-anchor="middle" >UART 9600: 7E FF 06 0F 01 02 07 FE E2 EF (folder 02, file 007)</text><text x="30" y="480" font-size="13" fill="#0B2545" text-anchor="start" font-weight="700" >7</text><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.6000;0.6120;0.95;1"/></g><circle r="6" fill="#2E7D32" opacity="0"><animateMotion dur="16.0s" repeatCount="indefinite" path="M570,476 L800,476" keyPoints="0;0;1;1" keyTimes="0;0.6000;0.6500;1" calcMode="linear"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6000;0.6010;0.6500;0.6510;1"/></circle><g opacity="1"><line x1="800" y1="530" x2="1040" y2="530" stroke="#7B1FA2" stroke-width="3" stroke-linecap="round" /><polygon points="1040,530 1028,523 1028,537" fill="#7B1FA2"/><text x="920.0" y="520" font-size="13" fill="#222" text-anchor="middle" >analog audio on DAC_L and DAC_R</text><text x="30" y="534" font-size="13" fill="#0B2545" text-anchor="start" font-weight="700" >8</text><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.7000;0.7120;0.95;1"/></g><circle r="6" fill="#7B1FA2" opacity="0"><animateMotion dur="16.0s" repeatCount="indefinite" path="M800,530 L1040,530" keyPoints="0;0;1;1" keyTimes="0;0.7000;0.7500;1" calcMode="linear"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7000;0.7010;0.7500;0.7510;1"/></circle><g opacity="1"><path d="M1040,572 h-46 v22 h46" fill="none" stroke="#607D8B" stroke-width="3"/><polygon points="1040,594 1030,588 1030,600" fill="#607D8B"/><text x="984" y="586" font-size="13" fill="#222" text-anchor="end" >amplified audio: speaker L and speaker R play</text><text x="30" y="588" font-size="13" fill="#0B2545" text-anchor="start" font-weight="700" >9</text><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.8000;0.8120;0.95;1"/></g><text x="600" y="632" font-size="12" fill="#555" text-anchor="middle" >Timings are not shown because they were not measured; the firmware polls every 250 ms and releases the latch after about 1 s without a tag.</text></svg>
