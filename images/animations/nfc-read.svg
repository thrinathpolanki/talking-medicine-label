<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Helvetica, Arial, sans-serif"><title>NFC tag reading animation</title><desc>A tag slides next to the PN532 reader, radio rings pulse, then the decoded record and the audio file name appear.</desc><rect width="900" height="300" fill="#ffffff"/><text x="450" y="30" font-size="20" fill="#0B2545" text-anchor="middle" font-weight="700">Reading a tag</text><rect x="60" y="90" width="200" height="110" rx="10" fill="#0B2545"/><text x="160.0" y="143.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">PN532</text><text x="160.0" y="161.0" font-size="11" fill="#bfe9e5" text-anchor="middle">NFC reader</text><circle cx="260" cy="145" r="10" fill="none" stroke="#13A89E" stroke-width="3"><animate attributeName="r" values="10;70" dur="2.4s" begin="0.00s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="260" cy="145" r="10" fill="none" stroke="#13A89E" stroke-width="3"><animate attributeName="r" values="10;70" dur="2.4s" begin="0.80s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="0.80s" repeatCount="indefinite"/></circle><circle cx="260" cy="145" r="10" fill="none" stroke="#13A89E" stroke-width="3"><animate attributeName="r" values="10;70" dur="2.4s" begin="1.60s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="1.60s" repeatCount="indefinite"/></circle><g><rect x="340" y="105" width="170" height="80" rx="10" fill="#fff" stroke="#0B2545" stroke-width="4"/><text x="425" y="140" font-size="15" fill="#0B2545" text-anchor="middle" font-weight="700">NTAG213</text><text x="425" y="164" font-size="11" fill="#444" text-anchor="middle">tag on medicine box</text><animateTransform attributeName="transform" type="translate" values="340 0;0 0;0 0;340 0" keyTimes="0;0.4;0.8;1" dur="8s" repeatCount="indefinite"/></g><g opacity="1"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.5;0.8;1" dur="8s" repeatCount="indefinite"/><text x="450" y="245" font-size="14" fill="#0B2545" text-anchor="middle" font-weight="700">Text record: language te, text TML:007</text><text x="450" y="270" font-size="13" fill="#333" text-anchor="middle">ESP32 plays /02/007.mp3 (folder 02 = Telugu)</text></g></svg>
