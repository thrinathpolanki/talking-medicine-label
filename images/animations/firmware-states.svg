<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" font-family="Helvetica, Arial, sans-serif"><title>Firmware loop animation</title><desc>Five states highlighted in turn: poll tag, read memory, validate record, play audio, wait for tag removal, then repeat.</desc><rect width="1000" height="280" fill="#ffffff"/><text x="500" y="34" font-size="20" fill="#0B2545" text-anchor="middle" font-weight="700">Firmware loop</text><circle cx="100" cy="130" r="58" fill="#fff" stroke="#0B2545" stroke-width="4"/><circle cx="100" cy="130" r="58" fill="#13A89E" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.9;0.9;0;0" keyTimes="0;0.000;0.001;0.200;0.201;1"/></circle><text x="100" y="135" font-size="13" fill="#0B2545" text-anchor="middle" font-weight="700">Poll tag</text><line x1="160" y1="130" x2="240" y2="130" stroke="#0B2545" stroke-width="3" stroke-linecap="round"/><polygon points="240,130 230,124 230,136" fill="#0B2545"/><circle cx="300" cy="130" r="58" fill="#fff" stroke="#0B2545" stroke-width="4"/><circle cx="300" cy="130" r="58" fill="#13A89E" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.9;0.9;0;0" keyTimes="0;0.200;0.201;0.400;0.401;1"/></circle><text x="300" y="135" font-size="13" fill="#0B2545" text-anchor="middle" font-weight="700">Read memory</text><line x1="360" y1="130" x2="440" y2="130" stroke="#0B2545" stroke-width="3" stroke-linecap="round"/><polygon points="440,130 430,124 430,136" fill="#0B2545"/><circle cx="500" cy="130" r="58" fill="#fff" stroke="#0B2545" stroke-width="4"/><circle cx="500" cy="130" r="58" fill="#13A89E" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.9;0.9;0;0" keyTimes="0;0.400;0.401;0.600;0.601;1"/></circle><text x="500" y="135" font-size="13" fill="#0B2545" text-anchor="middle" font-weight="700">Validate TML</text><line x1="560" y1="130" x2="640" y2="130" stroke="#0B2545" stroke-width="3" stroke-linecap="round"/><polygon points="640,130 630,124 630,136" fill="#0B2545"/><circle cx="700" cy="130" r="58" fill="#fff" stroke="#0B2545" stroke-width="4"/><circle cx="700" cy="130" r="58" fill="#13A89E" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.9;0.9;0;0" keyTimes="0;0.600;0.601;0.800;0.801;1"/></circle><text x="700" y="135" font-size="13" fill="#0B2545" text-anchor="middle" font-weight="700">Play audio</text><line x1="760" y1="130" x2="840" y2="130" stroke="#0B2545" stroke-width="3" stroke-linecap="round"/><polygon points="840,130 830,124 830,136" fill="#0B2545"/><circle cx="900" cy="130" r="58" fill="#fff" stroke="#0B2545" stroke-width="4"/><circle cx="900" cy="130" r="58" fill="#13A89E" opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.9;0.9;0;0" keyTimes="0;0.800;0.801;1.000;1.001;1"/></circle><text x="900" y="135" font-size="13" fill="#0B2545" text-anchor="middle" font-weight="700">Wait for removal</text><path d="M900,190 C900,250 100,250 100,190" fill="none" stroke="#0B2545" stroke-width="3" stroke-dasharray="8 6"/><text x="500" y="262" font-size="12" fill="#555" text-anchor="middle">tag removed: ready for the next tag. Buttons are checked on every pass.</text></svg>
