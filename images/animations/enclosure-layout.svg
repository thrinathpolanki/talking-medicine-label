<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="Helvetica, Arial, sans-serif"><title>Enclosure layout animation</title><desc>Top view with the NFC tap zone and pulsing rings, and a front view with two speakers, three differently shaped buttons, power switch, USB-C port and indicator LEDs.</desc><rect width="1200" height="430" fill="#fff"/><text x="600" y="34" font-size="20" fill="#0B2545" text-anchor="middle" font-weight="700" >Suggested enclosure layout (design suggestion, untested)</text><rect x="60" y="70" width="520" height="300" rx="18" fill="#ECEFF1" stroke="#37474F" stroke-width="4" /><text x="320" y="92" font-size="13" fill="#37474F" text-anchor="middle" font-weight="700" >TOP VIEW</text><circle cx="320" cy="210" r="70" fill="none" stroke="#13A89E" stroke-width="4" stroke-dasharray="10 8"/><text x="320" y="215" font-size="16" fill="#0B2545" text-anchor="middle" font-weight="700" >NFC tap zone</text><text x="320" y="238" font-size="12" fill="#444" text-anchor="middle" >PN532 antenna below, nothing metal above</text><circle cx="320" cy="210" r="78" fill="none" stroke="#13A89E" stroke-width="3" opacity="0"><animate attributeName="r" values="30;78" dur="2.4s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="320" cy="210" r="78" fill="none" stroke="#13A89E" stroke-width="3" opacity="0"><animate attributeName="r" values="30;78" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle><circle cx="320" cy="210" r="78" fill="none" stroke="#13A89E" stroke-width="3" opacity="0"><animate attributeName="r" values="30;78" dur="2.4s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle><circle cx="320" cy="340" r="9" fill="#37474F"/><text x="320" y="362" font-size="12" fill="#444" text-anchor="middle" >raised tactile dot marks the zone</text><rect x="660" y="70" width="480" height="300" rx="18" fill="#ECEFF1" stroke="#37474F" stroke-width="4" /><text x="900" y="92" font-size="13" fill="#37474F" text-anchor="middle" font-weight="700" >FRONT / SIDE VIEW</text><circle cx="740" cy="170" r="52" fill="#455A64"/><circle cx="740" cy="170" r="30" fill="#263238"/><text x="740" y="250" font-size="13" fill="#222" text-anchor="middle" >Speaker L</text><circle cx="740" cy="170" r="30" fill="none" stroke="#607D8B" stroke-width="3"><animate attributeName="r" values="30;70" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/></circle><circle cx="1060" cy="170" r="52" fill="#455A64"/><circle cx="1060" cy="170" r="30" fill="#263238"/><text x="1060" y="250" font-size="13" fill="#222" text-anchor="middle" >Speaker R</text><circle cx="1060" cy="170" r="30" fill="none" stroke="#607D8B" stroke-width="3"><animate attributeName="r" values="30;70" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/></circle><rect x="810" y="150" width="56" height="40" rx="8" fill="#37474F" stroke="none" stroke-width="0" /><text x="838" y="176" font-size="22" fill="#fff" text-anchor="middle" font-weight="700" >-</text><circle cx="900" cy="170" r="20" fill="#37474F"/><text x="900" y="176" font-size="22" fill="#fff" text-anchor="middle" font-weight="700" >+</text><polygon points="960,148 984,190 936,190" fill="#37474F"/><text x="960" y="184" font-size="16" fill="#fff" text-anchor="middle" font-weight="700" >L</text><text x="900" y="268" font-size="12" fill="#222" text-anchor="middle" >VOL - (square)   VOL + (round)   LANG (triangle)</text><text x="900" y="286" font-size="11" fill="#555" text-anchor="middle" >distinct shapes by touch, same order as the GPIOs: D25, D26, D27</text><rect x="700" y="300" width="90" height="50" rx="8" fill="#212121" stroke="none" stroke-width="0" /><text x="745" y="330" font-size="12" fill="#fff" text-anchor="middle" >SWITCH</text><circle cx="830" cy="325" r="10" fill="#1E88E5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle><text x="830" y="352" font-size="11" fill="#222" text-anchor="middle" >power</text><rect x="900" y="300" width="80" height="50" rx="8" fill="#90A4AE" stroke="none" stroke-width="0" /><text x="940" y="330" font-size="12" fill="#fff" text-anchor="middle" >USB-C</text><circle cx="1005" cy="316" r="9" fill="#E53935"><animate attributeName="opacity" values="1;0.2;1" dur="6s" repeatCount="indefinite"/></circle><circle cx="1005" cy="338" r="9" fill="#43A047"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/></circle><text x="1060" y="330" font-size="11" fill="#444" text-anchor="middle" >charge LEDs</text><text x="600" y="408" font-size="12" fill="#555" text-anchor="middle" >Keep the PN532 antenna facing the tap zone and away from metal parts; keep wires to the I2C header short; insulate the cell and leave ventilation.</text></svg>
