<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="Helvetica, Arial, sans-serif"><title>Signal flow animation</title><desc>Animated flow from NFC tag through PN532, ESP32, DFPlayer Mini and PAM8403 amplifier to two speakers, with buttons feeding the ESP32.</desc><rect width="1200" height="360" fill="#ffffff"/><text x="600" y="38" font-size="20" fill="#0B2545" text-anchor="middle" font-weight="700">From tag to spoken instruction</text><rect x="30" y="120" width="150" height="90" rx="10" fill="#0B2545"/><text x="105.0" y="163.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">NFC tag</text><text x="105.0" y="181.0" font-size="11" fill="#bfe9e5" text-anchor="middle">TML:007 + lang</text><rect x="230" y="120" width="150" height="90" rx="10" fill="#0B2545"/><text x="305.0" y="163.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">PN532</text><text x="305.0" y="181.0" font-size="11" fill="#bfe9e5" text-anchor="middle">NFC reader, I2C</text><rect x="430" y="120" width="150" height="90" rx="10" fill="#0B2545"/><text x="505.0" y="163.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">ESP32</text><text x="505.0" y="181.0" font-size="11" fill="#bfe9e5" text-anchor="middle">controller</text><rect x="630" y="120" width="150" height="90" rx="10" fill="#0B2545"/><text x="705.0" y="163.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">DFPlayer Mini</text><text x="705.0" y="181.0" font-size="11" fill="#bfe9e5" text-anchor="middle">microSD audio</text><rect x="830" y="120" width="150" height="90" rx="10" fill="#0B2545"/><text x="905.0" y="163.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">PAM8403</text><text x="905.0" y="181.0" font-size="11" fill="#bfe9e5" text-anchor="middle">stereo amp</text><rect x="1030" y="120" width="150" height="90" rx="10" fill="#0B2545"/><text x="1105.0" y="163.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">Speakers</text><text x="1105.0" y="181.0" font-size="11" fill="#bfe9e5" text-anchor="middle">L and R</text><line x1="180" y1="165" x2="230" y2="165" stroke="#13A89E" stroke-width="4" stroke-linecap="round"/><text x="205.0" y="152" font-size="11" fill="#333" text-anchor="middle">RF</text><line x1="380" y1="165" x2="430" y2="165" stroke="#1E88E5" stroke-width="4" stroke-linecap="round"/><text x="405.0" y="152" font-size="11" fill="#333" text-anchor="middle">I2C</text><line x1="580" y1="165" x2="630" y2="165" stroke="#2E7D32" stroke-width="4" stroke-linecap="round"/><text x="605.0" y="152" font-size="11" fill="#333" text-anchor="middle">UART2</text><line x1="780" y1="165" x2="830" y2="165" stroke="#7B1FA2" stroke-width="4" stroke-linecap="round"/><text x="805.0" y="152" font-size="11" fill="#333" text-anchor="middle">DAC L/R</text><line x1="980" y1="165" x2="1030" y2="165" stroke="#607D8B" stroke-width="4" stroke-linecap="round"/><text x="1005.0" y="152" font-size="11" fill="#333" text-anchor="middle">BTL L/R</text><circle r="7" fill="#13A89E" opacity="0"><animateMotion dur="8.0s" repeatCount="indefinite" path="M180,165 L230,165" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.1062;1" calcMode="linear"/><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0010;0.1062;0.1072;1"/></circle><circle r="7" fill="#1E88E5" opacity="0"><animateMotion dur="8.0s" repeatCount="indefinite" path="M380,165 L430,165" keyPoints="0;0;1;1" keyTimes="0;0.1250;0.2313;1" calcMode="linear"/><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1250;0.1260;0.2313;0.2323;1"/></circle><circle r="7" fill="#2E7D32" opacity="0"><animateMotion dur="8.0s" repeatCount="indefinite" path="M580,165 L630,165" keyPoints="0;0;1;1" keyTimes="0;0.2500;0.3563;1" calcMode="linear"/><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2500;0.2510;0.3563;0.3573;1"/></circle><circle r="7" fill="#7B1FA2" opacity="0"><animateMotion dur="8.0s" repeatCount="indefinite" path="M780,165 L830,165" keyPoints="0;0;1;1" keyTimes="0;0.3750;0.4813;1" calcMode="linear"/><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3750;0.3760;0.4813;0.4823;1"/></circle><circle r="7" fill="#607D8B" opacity="0"><animateMotion dur="8.0s" repeatCount="indefinite" path="M980,165 L1030,165" keyPoints="0;0;1;1" keyTimes="0;0.5000;0.6062;1" calcMode="linear"/><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5010;0.6062;0.6072;1"/></circle><rect x="430" y="260" width="150" height="50" rx="10" fill="#13A89E"/><text x="505.0" y="283.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">3 buttons</text><text x="505.0" y="301.0" font-size="11" fill="#444" text-anchor="middle">vol +/-, language</text><line x1="505" y1="260" x2="505" y2="210" stroke="#6D4C41" stroke-width="4" stroke-linecap="round"/><text x="560" y="240" font-size="11" fill="#333" text-anchor="start">GPIO25/26/27</text><circle r="7" fill="#6D4C41" opacity="0"><animateMotion dur="8.0s" repeatCount="indefinite" path="M505,260 L505,210" keyPoints="0;0;1;1" keyTimes="0;0.7500;0.8562;1" calcMode="linear"/><animate attributeName="opacity" dur="8.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7500;0.7510;0.8562;0.8572;1"/></circle><circle cx="180" cy="165" r="6" fill="none" stroke="#13A89E" stroke-width="3"><animate attributeName="r" values="6;34" dur="2.4s" begin="0.00s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="180" cy="165" r="6" fill="none" stroke="#13A89E" stroke-width="3"><animate attributeName="r" values="6;34" dur="2.4s" begin="1.20s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="1.20s" repeatCount="indefinite"/></circle><circle cx="1165" cy="165" r="6" fill="none" stroke="#607D8B" stroke-width="3"><animate attributeName="r" values="6;30" dur="2.4s" begin="0.00s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="1165" cy="165" r="6" fill="none" stroke="#607D8B" stroke-width="3"><animate attributeName="r" values="6;30" dur="2.4s" begin="0.80s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="0.80s" repeatCount="indefinite"/></circle><circle cx="1165" cy="165" r="6" fill="none" stroke="#607D8B" stroke-width="3"><animate attributeName="r" values="6;30" dur="2.4s" begin="1.60s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.4s" begin="1.60s" repeatCount="indefinite"/></circle><text x="600" y="345" font-size="12" fill="#555" text-anchor="middle">Dots show the direction of data; the animation repeats forever.</text></svg>
