<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" font-family="Helvetica, Arial, sans-serif"><title>Security and safety policy header animation</title><desc>No network features, no personal data. Decorative animated header.</desc><rect width="1200" height="130" fill="#0B2545"/><text x="40" y="62" font-size="36" fill="#fff" text-anchor="start" font-weight="700">Security and safety policy</text><text x="40" y="98" font-size="16" fill="#bfe9e5" text-anchor="start">No network features, no personal data</text><g><polygon points="1090,30 1140,110 1040,110" fill="none" stroke="#FFB300" stroke-width="6" stroke-linejoin="round"/><text x="1090" y="100" font-size="44" fill="#FFB300" text-anchor="middle" font-weight="700">!</text><animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/></g><rect x="0" y="118" width="1200" height="12" fill="#13A89E"/><rect x="0" y="118" width="200" height="12" fill="#fff" opacity="0.65"><animate attributeName="x" values="-200;1200" dur="4s" repeatCount="indefinite"/></rect></svg>
