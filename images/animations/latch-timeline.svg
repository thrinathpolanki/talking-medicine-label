<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="Helvetica, Arial, sans-serif"><title>Same-tag latch timeline animation</title><desc>A playhead sweeps a timeline: first presentation plays audio, the latch blocks repeats while the tag stays, releases after four missed polls, and the next presentation plays again.</desc><rect width="1200" height="440" fill="#fff"/><text x="600" y="34" font-size="20" fill="#0B2545" text-anchor="middle" font-weight="700" >Same-tag latch and re-detection (illustrative timeline)</text><text x="100" y="126" font-size="14" fill="#222" text-anchor="end" font-weight="700" >Tag in range</text><rect x="120" y="100" width="1000" height="40" rx="4" fill="#F5F5F5" stroke="#CCC" stroke-width="1" /><text x="100" y="196" font-size="14" fill="#222" text-anchor="end" font-weight="700" >Latch</text><rect x="120" y="170" width="1000" height="40" rx="4" fill="#F5F5F5" stroke="#CCC" stroke-width="1" /><text x="100" y="266" font-size="14" fill="#222" text-anchor="end" font-weight="700" >Audio</text><rect x="120" y="240" width="1000" height="40" rx="4" fill="#F5F5F5" stroke="#CCC" stroke-width="1" /><rect x="220.0" y="100" width="300.0" height="40" rx="4" fill="#90CAF9" stroke="#1E88E5" stroke-width="2" /><text x="370.0" y="126" font-size="13" fill="#222" text-anchor="middle" >tag present</text><rect x="670.0" y="100" width="175.0" height="40" rx="4" fill="#90CAF9" stroke="#1E88E5" stroke-width="2" /><text x="757.5" y="126" font-size="13" fill="#222" text-anchor="middle" >tag present</text><rect x="232.5" y="170" width="337.5" height="40" rx="4" fill="#FFE082" stroke="#FFA000" stroke-width="2" /><text x="401.25" y="196" font-size="13" fill="#222" text-anchor="middle" >latched: no repeat</text><rect x="682.5" y="170" width="212.5" height="40" rx="4" fill="#FFE082" stroke="#FFA000" stroke-width="2" /><text x="788.75" y="196" font-size="13" fill="#222" text-anchor="middle" >latched: no repeat</text><rect x="2