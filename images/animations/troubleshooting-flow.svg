<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Helvetica, Arial, sans-serif"><title>Troubleshooting flow animation</title><desc>A highlight walks down seven questions; each No answer lists the first things to check.</desc><rect width="1200" height="660" fill="#fff"/><text x="600" y="34" font-size="20" fill="#0B2545" text-anchor="middle" font-weight="700" >No sound? Follow the chain from the top</text><rect x="160" y="70" width="330" height="52" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="325" y="102" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Blue LED on?</text><line x1="325" y1="122" x2="325" y2="148" stroke="#888" stroke-width="3" stroke-linecap="round" /><line x1="490" y1="96" x2="560" y2="96" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><rect x="560" y="70" width="520" height="52" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2" /><text x="570" y="101" font-size="13" fill="#7f1d1d" text-anchor="start" >No: switch OFF / cell empty / MT3608 not 5.0 V</text><rect x="150" y="64" width="350" height="64" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.0000;0.0100;0.1250;1"/></rect><rect x="160" y="148" width="330" height="52" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="325" y="180" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Serial: "PN532 online"?</text><line x1="325" y1="200" x2="325" y2="226" stroke="#888" stroke-width="3" stroke-linecap="round" /><line x1="490" y1="174" x2="560" y2="174" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><rect x="560" y="148" width="520" height="52" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2" /><text x="570" y="179" font-size="13" fill="#7f1d1d" text-anchor="start" >No: DIP S1 ON, S2 OFF; SDA, SCL, IRQ, 3V3; try PN532_IRQ_PIN 0xFF</text><rect x="150" y="142" width="350" height="64" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.1250;0.1350;0.2500;1"/></rect><rect x="160" y="226" width="330" height="52" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="325" y="258" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Serial: "DFPlayer online"?</text><line x1="325" y1="278" x2="325" y2="304" stroke="#888" stroke-width="3" stroke-linecap="round" /><line x1="490" y1="252" x2="560" y2="252" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><rect x="560" y="226" width="520" height="52" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2" /><text x="570" y="257" font-size="13" fill="#7f1d1d" text-anchor="start" >No: TX/RX crossed, 1k resistor, FAT32 card, 5 V, boot delay</text><rect x="150" y="220" width="350" height="64" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.2500;0.2600;0.3750;1"/></rect><rect x="160" y="304" width="330" height="52" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="325" y="336" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Tag UID printed?</text><line x1="325" y1="356" x2="325" y2="382" stroke="#888" stroke-width="3" stroke-linecap="round" /><line x1="490" y1="330" x2="560" y2="330" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><rect x="560" y="304" width="520" height="52" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2" /><text x="570" y="335" font-size="13" fill="#7f1d1d" text-anchor="start" >No: tag type NTAG, distance 1-4 cm, no metal</text><rect x="150" y="298" width="350" height="64" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.3750;0.3850;0.5000;1"/></rect><rect x="160" y="382" width="330" height="52" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="325" y="414" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >"Valid tag ... playing" printed?</text><line x1="325" y1="434" x2="325" y2="460" stroke="#888" stroke-width="3" stroke-linecap="round" /><line x1="490" y1="408" x2="560" y2="408" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><rect x="560" y="382" width="520" height="52" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2" /><text x="570" y="413" font-size="13" fill="#7f1d1d" text-anchor="start" >No: write the Text record TML:nnn with a language code</text><rect x="150" y="376" width="350" height="64" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.5000;0.5100;0.6250;1"/></rect><rect x="160" y="460" width="330" height="52" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="325" y="492" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >No "Audio file missing"?</text><line x1="325" y1="512" x2="325" y2="538" stroke="#888" stroke-width="3" stroke-linecap="round" /><line x1="490" y1="486" x2="560" y2="486" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><rect x="560" y="460" width="520" height="52" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2" /><text x="570" y="491" font-size="13" fill="#7f1d1d" text-anchor="start" >No: file name /NN/NNN.mp3, remove ._ files</text><rect x="150" y="454" width="350" height="64" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.6250;0.6350;0.7500;1"/></rect><rect x="160" y="538" width="330" height="52" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="325" y="570" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Speaker still silent?</text><line x1="490" y1="564" x2="560" y2="564" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><rect x="560" y="538" width="520" height="52" rx="8" fill="#FDECEA" stroke="#C0392B" stroke-width="2" /><text x="570" y="569" font-size="13" fill="#7f1d1d" text-anchor="start" >No: PAM8403 5V, DAC_L/DAC_R, L+/L-, R+/R- wiring, volume</text><rect x="150" y="532" width="350" height="64" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.7500;0.7600;0.8750;1"/></rect><text x="100" y="100" font-size="12" fill="#2E7D32" text-anchor="middle" font-weight="700" >Yes</text><circle r="8" fill="#2E7D32" opacity="0"><animateMotion dur="14.0s" repeatCount="indefinite" path="M325,96 L325,570" keyPoints="0;0;1;1" keyTimes="0;0.0300;0.9000;1" calcMode="linear"/><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0300;0.0310;0.9000;0.9010;1"/></circle><text x="600" y="640" font-size="12" fill="#555" text-anchor="middle" >Yes at every step means the chain is healthy; the first No is where to start. More checks: docs/testing-and-troubleshooting.md</text></svg>
