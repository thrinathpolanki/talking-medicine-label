<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" font-family="Helvetica, Arial, sans-serif"><title>Assembly guide header animation</title><desc>Twelve stages, each with a checkpoint. Decorative animated header.</desc><rect width="1200" height="130" fill="#0B2545"/><text x="40" y="62" font-size="36" fill="#fff" text-anchor="start" font-weight="700">Assembly guide</text><text x="40" y="98" font-size="16" fill="#bfe9e5" text-anchor="start">Twelve stages, each with a checkpoint</text><circle cx="660" cy="65" r="14" fill="#13A89E" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="0.0s" repeatCount="indefinite"/></circle><text x="660" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">1</text><circle cx="702" cy="65" r="14" fill="#13A89E" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="0.5s" repeatCount="indefinite"/></circle><text x="702" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">2</text><circle cx="744" cy="65" r="14" fill="#13A89E" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="1.0s" repeatCount="indefinite"/></circle><text x="744" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">3</text><circle cx="786" cy="65" r="14" fill="#13A89E" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="1.5s" repeatCount="indefinite"/></circle><text x="786" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">4</text><circle cx="828" cy="65" r="14" fill="#13A89E" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="2.0s" repeatCount="indefinite"/></circle><text x="828" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">5</text><circle cx="870" cy="65" r="14" fill="#13A89E" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="2.5s" repeatCount="indefinite"/></circle><text x="870" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">6</text><circle cx="912" cy="65" r="14" fill="#13A89E" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="3.0s" repeatCount="indefinite"/></circle><text x="912" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">7</text><circle cx="954" cy="65" r="14" fill="#13A89E" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="3.5s" repeatCount="indefinite"/></circle><text x="954" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">8</text><circle cx="996" cy="65" r="14" fill="#13A89E" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="4.0s" repeatCount="indefinite"/></circle><text x="996" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">9</text><circle cx="1038" cy="65" r="14" fill="#13A89E" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="4.5s" repeatCount="indefinite"/></circle><text x="1038" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">10</text><circle cx="1080" cy="65" r="14" fill="#13A89E" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="5.0s" repeatCount="indefinite"/></circle><text x="1080" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">11</text><circle cx="1122" cy="65" r="14" fill="#13A89E" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="6s" begin="5.5s" repeatCount="indefinite"/></circle><text x="1122" y="70" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">12</text><rect x="0" y="118" width="1200" height="12" fill="#13A89E"/><rect x="0" y="118" width="200" height="12" fill="#fff" opacity="0.65"><animate attributeName="x" values="-200;1200" dur="4s" repeatCount="indefinite"/></rect></svg>
