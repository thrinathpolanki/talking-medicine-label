<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 575" width="1200" height="575" font-family="Helvetica, Arial, sans-serif"><title>Power budget bar chart animation</title><desc>Bars grow for typical and peak current of each load, followed by totals on the rail and the cell side.</desc><rect width="1200" height="575" fill="#fff"/><text x="600" y="34" font-size="20" fill="#0B2545" text-anchor="middle" font-weight="700" >Estimated 5 V rail current by load (mA, estimates)</text><text x="300" y="102" font-size="14" fill="#222" text-anchor="end" >ESP32 (radios off)</text><rect x="320" y="80" width="130.0" height="20" rx="3" fill="#13A89E"><animate attributeName="width" values="0;130.0;130.0;0" keyTimes="0;0.35;0.95;1" dur="10.0s" repeatCount="indefinite"/></rect><rect x="320" y="104" width="240.0" height="20" rx="3" fill="#EF6C00"><animate attributeName="width" values="0;0;240.0;240.0;0" keyTimes="0;0.2;0.55;0.95;1" dur="10.0s" repeatCount="indefinite"/></rect><g opacity="0"><text x="460.0" y="95" font-size="12" fill="#222" text-anchor="start" >65</text><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3600;0.3720;0.9400;0.9520;1"/></g><g opacity="0"><text x="570.0" y="119" font-size="12" fill="#222" text-anchor="start" >120</text><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5600;0.5720;0.9400;0.9520;1"/></g><text x="300" y="166" font-size="14" fill="#222" text-anchor="end" >PN532 polling</text><rect x="320" y="144" width="70.0" height="20" rx="3" fill="#13A89E"><animate attributeName="width" values="0;70.0;70.0;0" keyTimes="0;0.35;0.95;1" dur="10.0s" repeatCount="indefinite"/></rect><rect x="320" y="168" width="100.0" height="20" rx="3" fill="#EF6C00"><animate attributeName="width" values="0;0;100.0;100.0;0" keyTimes="0;0.2;0.55;0.95;1" dur="10.0s" repeatCount="indefinite"/></rect><g opacity="0"><text x="400.0" y="159" font-size="12" fill="#222" text-anchor="start" >35</text><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3600;0.3720;0.9400;0.9520;1"/></g><g opacity="0"><text x="430.0" y="183" font-size="12" fill="#222" text-anchor="start" >50</text><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5600;0.5720;0.9400;0.9520;1"/></g><text x="300" y="230" font-size="14" fill="#222" text-anchor="end" >DFPlayer Mini</text><rect x="320" y="208" width="50.0" height="20" rx="3" fill="#13A89E"><animate attributeName="width" values="0;50.0;50.0;0" keyTimes="0;0.35;0.95;1" dur="10.0s" repeatCount="indefinite"/></rect><rect x="320" y="232" width="80.0" height="20" rx="3" fill="#EF6C00"><animate attributeName="width" values="0;0;80.0;80.0;0" keyTimes="0;0.2;0.55;0.95;1" dur="10.0s" repeatCount="indefinite"/></rect><g opacity="0"><text x="380.0" y="223" font-size="12" fill="#222" text-anchor="start" >25</text><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3600;0.3720;0.9400;0.9520;1"/></g><g opacity="0"><text x="410.0" y="247" font-size="12" fill="#222" text-anchor="start" >40</text><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5600;0.5720;0.9400;0.9520;1"/></g><text x="300" y="294" font-size="14" fill="#222" text-anchor="end" >PAM8403 + 2 x 0.5 W speakers</text><rect x="320" y="272" width="200.0" height="20" rx="3" fill="#13A89E"><animate attributeName="width" values="0;200.0;200.0;0" keyTimes="0;0.35;0.95;1" dur="10.0s" repeatCount="indefinite"/></rect><rect x="320" y="296" width="500.0" height="20" rx="3" fill="#EF6C00"><animate attributeName="width" values="0;0;500.0;500.0;0" keyTimes="0;0.2;0.55;0.95;1" dur="10.0s" repeatCount="indefinite"/></rect><g opacity="0"><text x="530.0" y="287" font-size="12" fill="#222" text-anchor="start" >100</text><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3600;0.3720;0.9400;0.9520;1"/></g><g opacity="0"><text x="830.0" y="311" font-size="12" fill="#222" text-anchor="start" >250</text><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5600;0.5720;0.9400;0.9520;1"/></g><text x="300" y="358" font-size="14" fill="#222" text-anchor="end" >LEDs</text><rect x="320" y="336" width="6.0" height="20" rx="3" fill="#13A89E"><animate attributeName="width" values="0;6.0;6.0;0" keyTimes="0;0.35;0.95;1" dur="10.0s" repeatCount="indefinite"/></rect><rect x="320" y="360" width="20.0" height="20" rx="3" fill="#EF6C00"><animate attributeName="width" values="0;0;20.0;20.0;0" keyTimes="0;0.2;0.55;0.95;1" dur="10.0s" repeatCount="indefinite"/></rect><g opacity="0"><text x="336.0" y="351" font-size="12" fill="#222" text-anchor="start" >3</text><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3600;0.3720;0.9400;0.9520;1"/></g><g opacity="0"><text x="350.0" y="375" font-size="12" fill="#222" text-anchor="start" >10</text><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5600;0.5720;0.9400;0.9520;1"/></g><rect x="320" y="404" width="16" height="16" rx="3" fill="#13A89E" stroke="none" stroke-width="0" /><text x="344" y="417" font-size="13" fill="#222" text-anchor="start" >typical</text><rect x="430" y="404" width="16" height="16" rx="3" fill="#EF6C00" stroke="none" stroke-width="0" /><text x="454" y="417" font-size="13" fill="#222" text-anchor="start" >peak (speakers at their 0.5 W rating)</text><text x="40" y="460" font-size="14" fill="#0B2545" text-anchor="start" font-weight="700" >Rail total: </text><text x="330" y="460" font-size="14" fill="#222" text-anchor="start" >about 230 mA typical, about 470 mA peak</text><text x="40" y="486" font-size="14" fill="#0B2545" text-anchor="start" font-weight="700" >Cell side at 3.7 V: </text><text x="330" y="486" font-size="14" fill="#222" text-anchor="start" >about 0.37 A typical, 0.75 A peak</text><text x="40" y="512" font-size="14" fill="#0B2545" text-anchor="start" font-weight="700" >Cell side at 3.2 V (nearly empty): </text><text x="330" y="512" font-size="14" fill="#222" text-anchor="start" >about 0.42 A typical, 0.86 A peak</text><text x="40" y="550" font-size="12" fill="#555" text-anchor="start" >Boost converter efficiency assumed 85%. MT3608 comfortable range is 1-1.5 A. Overdriving the amplifier would exceed this and damage the speakers.</text></svg>
