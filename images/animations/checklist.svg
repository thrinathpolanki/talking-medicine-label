<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380" font-family="Helvetica, Arial, sans-serif"><title>Checklist animation</title><desc>Seven validation items are ticked one after another, then the animation restarts.</desc><rect width="620" height="380" fill="#ffffff"/><text x="300" y="32" font-size="20" fill="#0B2545" text-anchor="middle" font-weight="700">Validation checklist</text><rect x="30" y="60" width="28" height="28" rx="5" fill="#fff" stroke="#0B2545" stroke-width="3"/><path d="M36,75 L43,82 L53,67" fill="none" stroke="#13A89E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" dur="14.0s" repeatCount="indefinite" values="30;30;0;0;30" keyTimes="0;0.000;0.040;0.93;1"/></path><text x="76" y="80" font-size="15" fill="#222" text-anchor="start">MT3608 measured at 5.0 V</text><rect x="30" y="104" width="28" height="28" rx="5" fill="#fff" stroke="#0B2545" stroke-width="3"/><path d="M36,119 L43,126 L53,111" fill="none" stroke="#13A89E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" dur="14.0s" repeatCount="indefinite" values="30;30;0;0;30" keyTimes="0;0.125;0.165;0.93;1"/></path><text x="76" y="124" font-size="15" fill="#222" text-anchor="start">PN532 found at I2C 0x24</text><rect x="30" y="148" width="28" height="28" rx="5" fill="#fff" stroke="#0B2545" stroke-width="3"/><path d="M36,163 L43,170 L53,155" fill="none" stroke="#13A89E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" dur="14.0s" repeatCount="indefinite" values="30;30;0;0;30" keyTimes="0;0.250;0.290;0.93;1"/></path><text x="76" y="168" font-size="15" fill="#222" text-anchor="start">DFPlayer online, SD card read</text><rect x="30" y="192" width="28" height="28" rx="5" fill="#fff" stroke="#0B2545" stroke-width="3"/><path d="M36,207 L43,214 L53,199" fill="none" stroke="#13A89E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" dur="14.0s" repeatCount="indefinite" values="30;30;0;0;30" keyTimes="0;0.375;0.415;0.93;1"/></path><text x="76" y="212" font-size="15" fill="#222" text-anchor="start">Tag plays the right recording</text><rect x="30" y="236" width="28" height="28" rx="5" fill="#fff" stroke="#0B2545" stroke-width="3"/><path d="M36,251 L43,258 L53,243" fill="none" stroke="#13A89E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" dur="14.0s" repeatCount="indefinite" values="30;30;0;0;30" keyTimes="0;0.500;0.540;0.93;1"/></path><text x="76" y="256" font-size="15" fill="#222" text-anchor="start">Same tag does not repeat</text><rect x="30" y="280" width="28" height="28" rx="5" fill="#fff" stroke="#0B2545" stroke-width="3"/><path d="M36,295 L43,302 L53,287" fill="none" stroke="#13A89E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" dur="14.0s" repeatCount="indefinite" values="30;30;0;0;30" keyTimes="0;0.625;0.665;0.93;1"/></path><text x="76" y="300" font-size="15" fill="#222" text-anchor="start">Buttons change volume and language</text><rect x="30" y="324" width="28" height="28" rx="5" fill="#fff" stroke="#0B2545" stroke-width="3"/><path d="M36,339 L43,346 L53,331" fill="none" stroke="#13A89E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" dur="14.0s" repeatCount="indefinite" values="30;30;0;0;30" keyTimes="0;0.750;0.790;0.93;1"/></path><text x="76" y="344" font-size="15" fill="#222" text-anchor="start">Charging LEDs and switch 