<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="Helvetica, Arial, sans-serif"><title>Buttons demo animation</title><desc>Button presses light up in sequence; the volume marker moves along a seven-step ladder and the language marker switches between English and Telugu.</desc><rect width="1200" height="430" fill="#fff"/><text x="600" y="34" font-size="20" fill="#0B2545" text-anchor="middle" font-weight="700" >The three buttons (D25 volume down, D26 volume up, D27 language)</text><circle cx="180" cy="150" r="52" fill="#37474F" stroke="#111" stroke-width="4"/><text x="180" y="155" font-size="18" fill="#fff" text-anchor="middle" font-weight="700" >VOL -</text><text x="180" y="235" font-size="14" fill="#333" text-anchor="middle" >D25</text><circle cx="330" cy="150" r="52" fill="#37474F" stroke="#111" stroke-width="4"/><text x="330" y="155" font-size="18" fill="#fff" text-anchor="middle" font-weight="700" >VOL +</text><text x="330" y="235" font-size="14" fill="#333" text-anchor="middle" >D26</text><circle cx="480" cy="150" r="52" fill="#37474F" stroke="#111" stroke-width="4"/><text x="480" y="155" font-size="18" fill="#fff" text-anchor="middle" font-weight="700" >LANG</text><text x="480" y="235" font-size="14" fill="#333" text-anchor="middle" >D27</text><circle cx="330" cy="150" r="52" fill="#13A89E" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;0.85;0;0" keyTimes="0;0.0625;0.0725;0.1125;1"/></circle><circle cx="330" cy="150" r="52" fill="#13A89E" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;0.85;0;0" keyTimes="0;0.1875;0.1975;0.2375;1"/></circle><circle cx="330" cy="150" r="52" fill="#13A89E" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;0.85;0;0" keyTimes="0;0.3125;0.3225;0.3625;1"/></circle><circle cx="330" cy="150" r="52" fill="#13A89E" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;0.85;0;0" keyTimes="0;0.4375;0.4475;0.4875;1"/></circle><circle cx="180" cy="150" r="52" fill="#13A89E" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;0.85;0;0" keyTimes="0;0.5625;0.5725;0.6125;1"/></circle><circle cx="480" cy="150" r="52" fill="#13A89E" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;0.85;0;0" keyTimes="0;0.6875;0.6975;0.7375;1"/></circle><circle cx="480" cy="150" r="52" fill="#13A89E" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;0.85;0;0" keyTimes="0;0.8125;0.8225;0.8625;1"/></circle><text x="860" y="90" font-size="15" fill="#0B2545" text-anchor="middle" font-weight="700" >Volume (DFPlayer 0-30; firmware range 3-15, step 2)</text><rect x="670" y="110" width="44" height="100" rx="6" fill="#ECEFF1" stroke="#90A4AE" stroke-width="2" /><text x="692" y="235" font-size="13" fill="#222" text-anchor="middle" >3</text><rect x="722" y="110" width="44" height="100" rx="6" fill="#ECEFF1" stroke="#90A4AE" stroke-width="2" /><text x="744" y="235" font-size="13" fill="#222" text-anchor="middle" >5</text><rect x="774" y="110" width="44" height="100" rx="6" fill="#ECEFF1" stroke="#90A4AE" stroke-width="2" /><text x="796" y="235" font-size="13" fill="#222" text-anchor="middle" >7</text><rect x="826" y="110" width="44" height="100" rx="6" fill="#ECEFF1" stroke="#90A4AE" stroke-width="2" /><text x="848" y="235" font-size="13" fill="#222" text-anchor="middle" >9</text><rect x="878" y="110" width="44" height="100" rx="6" fill="#ECEFF1" stroke="#90A4AE" stroke-width="2" /><text x="900" y="235" font-size="13" fill="#222" text-anchor="middle" >11</text><rect x="930" y="110" width="44" height="100" rx="6" fill="#ECEFF1" stroke="#90A4AE" stroke-width="2" /><text x="952" y="235" font-size="13" fill="#222" text-anchor="middle" >13</text><rect x="982" y="110" width="44" height="100" rx="6" fill="#ECEFF1" stroke="#90A4AE" stroke-width="2" /><text x="1004" y="235" font-size="13" fill="#222" text-anchor="middle" >15</text><rect x="826" y="110" width="44" height="100" rx="6" fill="#13A89E" opacity="0.6"><animate attributeName="x" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="826;826;878;930;982;982;930;930;930" keyTimes="0;0.0625;0.1875;0.3125;0.4375;0.5625;0.6875;0.8125;1"/></rect><text x="860" y="270" font-size="13" fill="#555" text-anchor="middle" >Start at 9. Four presses of + stop at 15 (limit beep). One - goes back to 13.</text><text x="330" y="330" font-size="15" fill="#0B2545" text-anchor="middle" font-weight="700" >Language (button D27)</text><rect x="150" y="350" width="160" height="50" rx="8" fill="#ECEFF1" stroke="#90A4AE" stroke-width="2" /><text x="230" y="383" font-size="16" fill="#222" text-anchor="middle" >English</text><rect x="350" y="350" width="160" height="50" rx="8" fill="#ECEFF1" stroke="#90A4AE" stroke-width="2" /><text x="430" y="383" font-size="16" fill="#222" text-anchor="middle" >Telugu</text><rect x="150" y="350" width="160" height="50" rx="8" fill="#13A89E" opacity="0.35"><animate attributeName="x" dur="18.0s" repeatCount="indefinite" calcMode="discrete" values="150;350;150;150" keyTimes="0;0.6875;0.8125;1"/></rect><text x="860" y="350" font-size="13" fill="#555" text-anchor="middle" >Each press of D27 plays a spoken confirmation (/99/005 English, /99/006 Telugu).</text><text x="860" y="372" font-size="13" fill="#555" text-anchor="middle" >Changing language does not replay the medicine: present the tag again.</text></svg>
