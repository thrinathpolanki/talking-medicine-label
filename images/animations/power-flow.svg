<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Helvetica, Arial, sans-serif"><title>Power flow animation</title><desc>Animated power path: USB-C charges the cell through the TP4056, the switch feeds the MT3608 boost converter, and the 5 V rail feeds ESP32, DFPlayer, PAM8403 and the blue LED.</desc><rect width="1200" height="420" fill="#ffffff"/><text x="600" y="30" font-size="20" fill="#0B2545" text-anchor="middle" font-weight="700">Power flow</text><rect x="30" y="150" width="130" height="80" rx="10" fill="#0B2545"/><text x="95.0" y="188.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">Li-ion cell</text><text x="95.0" y="206.0" font-size="11" fill="#bfe9e5" text-anchor="middle">18650 / 21700</text><rect x="210" y="150" width="150" height="80" rx="10" fill="#0B2545"/><text x="285.0" y="188.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">TP4056</text><text x="285.0" y="206.0" font-size="11" fill="#bfe9e5" text-anchor="middle">Type-C + protection</text><rect x="410" y="150" width="110" height="80" rx="10" fill="#0B2545"/><text x="465.0" y="188.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">Switch</text><text x="465.0" y="206.0" font-size="11" fill="#bfe9e5" text-anchor="middle">COM to OUT</text><rect x="570" y="150" width="150" height="80" rx="10" fill="#0B2545"/><text x="645.0" y="188.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">MT3608</text><text x="645.0" y="206.0" font-size="11" fill="#bfe9e5" text-anchor="middle">boost to 5.0 V</text><rect x="210" y="52" width="150" height="50" rx="10" fill="#13A89E"/><text x="285.0" y="75.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">USB-C 5 V</text><text x="285.0" y="93.0" font-size="11" fill="#444" text-anchor="middle">charging only</text><line x1="285" y1="102" x2="285" y2="150" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/><circle r="6" fill="#C0392B" opacity="0"><animateMotion dur="10.0s" repeatCount="indefinite" path="M285,102 L285,150" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.0850;1" calcMode="linear"/><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0010;0.0850;0.0860;1"/></circle><line x1="160" y1="190" x2="210" y2="190" stroke="#E67E22" stroke-width="4" stroke-linecap="round"/><line x1="360" y1="190" x2="410" y2="190" stroke="#E67E22" stroke-width="4" stroke-linecap="round"/><line x1="520" y1="190" x2="570" y2="190" stroke="#E67E22" stroke-width="4" stroke-linecap="round"/><circle r="6" fill="#E67E22" opacity="0"><animateMotion dur="10.0s" repeatCount="indefinite" path="M210,190 L160,190" keyPoints="0;0;1;1" keyTimes="0;0.1000;0.1850;1" calcMode="linear"/><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1000;0.1010;0.1850;0.1860;1"/></circle><circle r="6" fill="#E67E22" opacity="0"><animateMotion dur="10.0s" repeatCount="indefinite" path="M360,190 L410,190" keyPoints="0;0;1;1" keyTimes="0;0.2000;0.2850;1" calcMode="linear"/><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2010;0.2850;0.2860;1"/></circle><circle r="6" fill="#E67E22" opacity="0"><animateMotion dur="10.0s" repeatCount="indefinite" path="M520,190 L570,190" keyPoints="0;0;1;1" keyTimes="0;0.3000;0.3850;1" calcMode="linear"/><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3000;0.3010;0.3850;0.3860;1"/></circle><text x="390" y="125" font-size="11" fill="#333" text-anchor="middle">Charge LEDs</text><circle cx="380" cy="138" r="9" fill="#E53935" opacity="0.15"><animate attributeName="opacity" dur="4.0s" repeatCount="indefinite" values="0.15;0.15;1;1;0.15;0.15" keyTimes="0;0.000;0.001;0.500;0.501;1"/></circle><circle cx="405" cy="138" r="9" fill="#43A047" opacity="0.15"><animate attributeName="opacity" dur="4.0s" repeatCount="indefinite" values="0.15;0.15;1;1;0.15;0.15" keyTimes="0;0.500;0.501;1.000;1.001;1"/></circle><text x="390" y="160" font-size="1" fill="#fff" text-anchor="middle"></text><line x1="720" y1="190" x2="760" y2="190" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/><line x1="760" y1="190" x2="760" y2="262" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/><line x1="760" y1="262" x2="1160" y2="262" stroke="#C0392B" stroke-width="6" stroke-linecap="round"/><text x="1100" y="250" font-size="12" fill="#C0392B" text-anchor="end" font-weight="700">5 V rail</text><circle r="7" fill="#C0392B" opacity="0"><animateMotion dur="10.0s" repeatCount="indefinite" path="M720,190 L760,190 L760,262 L1160,262" keyPoints="0;0;1;1" keyTimes="0;0.4000;0.4850;1" calcMode="linear"/><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4000;0.4010;0.4850;0.4860;1"/></circle><rect x="780" y="310" width="120" height="60" rx="10" fill="#0B2545"/><text x="840.0" y="338.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">ESP32</text><text x="840.0" y="356.0" font-size="11" fill="#bfe9e5" text-anchor="middle">+ PN532 3.3 V</text><line x1="840" y1="262" x2="840" y2="310" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/><circle r="6" fill="#C0392B" opacity="0"><animateMotion dur="10.0s" repeatCount="indefinite" path="M840,262 L840,310" keyPoints="0;0;1;1" keyTimes="0;0.5000;0.5850;1" calcMode="linear"/><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5010;0.5850;0.5860;1"/></circle><rect x="920" y="310" width="120" height="60" rx="10" fill="#0B2545"/><text x="980.0" y="338.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">DFPlayer</text><text x="980.0" y="356.0" font-size="11" fill="#bfe9e5" text-anchor="middle">VCC</text><line x1="980" y1="262" x2="980" y2="310" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/><circle r="6" fill="#C0392B" opacity="0"><animateMotion dur="10.0s" repeatCount="indefinite" path="M980,262 L980,310" keyPoints="0;0;1;1" keyTimes="0;0.6000;0.6850;1" calcMode="linear"/><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6000;0.6010;0.6850;0.6860;1"/></circle><rect x="1050" y="310" width="120" height="60" rx="10" fill="#0B2545"/><text x="1110.0" y="338.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">PAM8403</text><text x="1110.0" y="356.0" font-size="11" fill="#bfe9e5" text-anchor="middle">5V</text><line x1="1110" y1="262" x2="1110" y2="310" stroke="#C0392B" stroke-width="4" stroke-linecap="round"/><circle r="6" fill="#C0392B" opacity="0"><animateMotion dur="10.0s" repeatCount="indefinite" path="M1110,262 L1110,310" keyPoints="0;0;1;1" keyTimes="0;0.7000;0.7850;1" calcMode="linear"/><animate attributeName="opacity" dur="10.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7000;0.7010;0.7850;0.7860;1"/></circle><text x="1170" y="345" font-size="1" fill="#fff" text-anchor="middle"></text><circle cx="1000" cy="215" r="0"/><line x1="650" y1="230" x2="650" y2="300" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/><rect x="600" y="300" width="100" height="50" rx="10" fill="#1E88E5"/><text x="650.0" y="323.0" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">Blue LED</text><text x="650.0" y="341.0" font-size="11" fill="#444" text-anchor="middle">power ON</text><circle cx="650" cy="285" r="10" fill="#1E88E5"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.0s" begin="0s" repeatCount="indefinite"/></circle><text x="600" y="400" font-size="12" fill="#555" text-anchor="middle">Orange = battery side (3.0-4.2 V), red = regulated 5 V. Red/green LEDs alternate to show the two charge states.</text></svg>
