<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" font-family="Helvetica, Arial, sans-serif"><title>Assembly stages animation</title><desc>Twelve assembly stage cards are highlighted in turn with a progress bar underneath.</desc><rect width="1200" height="580" fill="#fff"/><text x="600" y="34" font-size="20" fill="#0B2545" text-anchor="middle" font-weight="700" >Twelve stages, one checkpoint each</text><rect x="40" y="70" width="270" height="120" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="70" y="110" font-size="26" fill="#13A89E" text-anchor="middle" font-weight="700" >1</text><text x="100" y="112" font-size="18" fill="#fff" text-anchor="start" font-weight="700" >Inspect</text><text x="60" y="154" font-size="13" fill="#bfe9e5" text-anchor="start" >Checkpoint: no bridges, chips match</text><rect x="36" y="66" width="278" height="128" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.0000;0.0100;0.0769;1"/></rect><rect x="330" y="70" width="270" height="120" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="360" y="110" font-size="26" fill="#13A89E" text-anchor="middle" font-weight="700" >2</text><text x="390" y="112" font-size="18" fill="#fff" text-anchor="start" font-weight="700" >Pinouts</text><text x="350" y="154" font-size="13" fill="#bfe9e5" text-anchor="start" >Checkpoint: every label found</text><rect x="326" y="66" width="278" height="128" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.0769;0.0869;0.1538;1"/></rect><rect x="620" y="70" width="270" height="120" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="650" y="110" font-size="26" fill="#13A89E" text-anchor="middle" font-weight="700" >3</text><text x="680" y="112" font-size="18" fill="#fff" text-anchor="start" font-weight="700" >Power section</text><text x="640" y="154" font-size="13" fill="#bfe9e5" text-anchor="start" >Checkpoint: cell, TP4056, switch</text><rect x="616" y="66" width="278" height="128" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.1538;0.1638;0.2308;1"/></rect><rect x="910" y="70" width="270" height="120" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="940" y="110" font-size="26" fill="#13A89E" text-anchor="middle" font-weight="700" >4</text><text x="970" y="112" font-size="18" fill="#fff" text-anchor="start" font-weight="700" >Tune MT3608</text><text x="930" y="154" font-size="13" fill="#bfe9e5" text-anchor="start" >Checkpoint: exactly 5.0 V</text><rect x="906" y="66" width="278" height="128" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.2308;0.2408;0.3077;1"/></rect><rect x="40" y="220" width="270" height="120" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="70" y="260" font-size="26" fill="#13A89E" text-anchor="middle" font-weight="700" >5</text><text x="100" y="262" font-size="18" fill="#fff" text-anchor="start" font-weight="700" >ESP32 + PN532</text><text x="60" y="304" font-size="13" fill="#bfe9e5" text-anchor="start" >Checkpoint: I2C + IRQ + RSTO</text><rect x="36" y="216" width="278" height="128" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.3077;0.3177;0.3846;1"/></rect><rect x="330" y="220" width="270" height="120" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="360" y="260" font-size="26" fill="#13A89E" text-anchor="middle" font-weight="700" >6</text><text x="390" y="262" font-size="18" fill="#fff" text-anchor="start" font-weight="700" >DFPlayer</text><text x="350" y="304" font-size="13" fill="#bfe9e5" text-anchor="start" >Checkpoint: UART + 1k resistor</text><rect x="326" y="216" width="278" height="128" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.3846;0.3946;0.4615;1"/></rect><rect x="620" y="220" width="270" height="120" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="650" y="260" font-size="26" fill="#13A89E" text-anchor="middle" font-weight="700" >7</text><text x="680" y="262" font-size="18" fill="#fff" text-anchor="start" font-weight="700" >Amp + speakers</text><text x="640" y="304" font-size="13" fill="#bfe9e5" text-anchor="start" >Checkpoint: L- R- not grounded</text><rect x="616" y="216" width="278" height="128" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.4615;0.4715;0.5385;1"/></rect><rect x="910" y="220" width="270" height="120" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="940" y="260" font-size="26" fill="#13A89E" text-anchor="middle" font-weight="700" >7b</text><text x="970" y="262" font-size="18" fill="#fff" text-anchor="start" font-weight="700" >Buttons + LEDs</text><text x="930" y="304" font-size="13" fill="#bfe9e5" text-anchor="start" >Checkpoint: GPIO25/26/27</text><rect x="906" y="216" width="278" height="128" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.5385;0.5485;0.6154;1"/></rect><rect x="40" y="370" width="270" height="120" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="70" y="410" font-size="26" fill="#13A89E" text-anchor="middle" font-weight="700" >8</text><text x="100" y="412" font-size="18" fill="#fff" text-anchor="start" font-weight="700" >microSD</text><text x="60" y="454" font-size="13" fill="#bfe9e5" text-anchor="start" >Checkpoint: FAT32 + /01 /02 /99</text><rect x="36" y="366" width="278" height="128" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.6154;0.6254;0.6923;1"/></rect><rect x="330" y="370" width="270" height="120" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="360" y="410" font-size="26" fill="#13A89E" text-anchor="middle" font-weight="700" >9</text><text x="390" y="412" font-size="18" fill="#fff" text-anchor="start" font-weight="700" >Program</text><text x="350" y="454" font-size="13" fill="#bfe9e5" text-anchor="start" >Checkpoint: switch OFF, USB</text><rect x="326" y="366" width="278" height="128" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.6923;0.7023;0.7692;1"/></rect><rect x="620" y="370" width="270" height="120" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="650" y="410" font-size="26" fill="#13A89E" text-anchor="middle" font-weight="700" >10</text><text x="680" y="412" font-size="18" fill="#fff" text-anchor="start" font-weight="700" >Test tag + audio</text><text x="640" y="454" font-size="13" fill="#bfe9e5" text-anchor="start" >Checkpoint: plays, no repeat</text><rect x="616" y="366" width="278" height="128" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.7692;0.7792;0.8462;1"/></rect><rect x="910" y="370" width="270" height="120" rx="8" fill="#0B2545" stroke="none" stroke-width="0" /><text x="940" y="410" font-size="26" fill="#13A89E" text-anchor="middle" font-weight="700" >11</text><text x="970" y="412" font-size="18" fill="#fff" text-anchor="start" font-weight="700" >Switch + charge</text><text x="930" y="454" font-size="13" fill="#bfe9e5" text-anchor="start" >Checkpoint: charge with switch OFF</text><rect x="906" y="366" width="278" height="128" rx="12" fill="none" stroke="#13A89E" stroke-width="6" opacity="0"><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.8462;0.8562;0.9231;1"/></rect><rect x="40" y="520" width="1120" height="14" rx="7" fill="#13A89E"><animate attributeName="width" values="0;1120" dur="18.0s" repeatCount="indefinite"/></rect><rect x="40" y="520" width="1120" height="14" rx="7" fill="none" stroke="#999" stroke-width="1" /><text x="600" y="560" font-size="13" fill="#555" text-anchor="middle" >Do not advance until the checkpoint passes. Record each result in tests/hardware-validation-checklist.md.</text></svg>
