<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Helvetica, Arial, sans-serif"><title>Charging cycle animation</title><desc>Battery fills while the red LED is lit; phases are named; the green LED lights when charging completes; schematic voltage and current curves are drawn.</desc><rect width="1200" height="400" fill="#fff"/><text x="600" y="34" font-size="20" fill="#0B2545" text-anchor="middle" font-weight="700" >TP4056 charging cycle (schematic shape, not measured)</text><rect x="60" y="80" width="360" height="150" rx="10" fill="#fff" stroke="#0B2545" stroke-width="4" /><rect x="420" y="125" width="24" height="60" rx="4" fill="#0B2545" stroke="none" stroke-width="0" /><rect x="68" y="88" width="344" height="134" rx="6" fill="#13A89E"><animate attributeName="width" values="0;40;150;344;344;0" keyTimes="0;0.12;0.5;0.85;0.97;1" dur="14.0s" repeatCount="indefinite"/></rect><g opacity="0"><text x="60" y="265" font-size="16" fill="#0B2545" text-anchor="start" font-weight="700" >Pre-charge: cell below about 2.9 V, small current</text><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0120;0.1200;0.1320;1"/></g><g opacity="0"><text x="60" y="265" font-size="16" fill="#0B2545" text-anchor="start" font-weight="700" >Constant current: 1 A until 4.2 V</text><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1200;0.1320;0.5500;0.5620;1"/></g><g opacity="0"><text x="60" y="265" font-size="16" fill="#0B2545" text-anchor="start" font-weight="700" >Constant voltage 4.2 V: current falls</text><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5500;0.5620;0.8500;0.8620;1"/></g><g opacity="0"><text x="60" y="265" font-size="16" fill="#0B2545" text-anchor="start" font-weight="700" >Charge complete: STDBY pin low, green LED</text><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.8500;0.8620;0.9800;0.9920;1"/></g><text x="60" y="310" font-size="12" fill="#555" text-anchor="start" >Typical datasheet values (not verified in this repository); termination near one tenth of the set current.</text><circle cx="560" cy="120" r="18" fill="#E53935" opacity="0.25"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.02;0.84;0.85;1"/></circle><text x="560" y="162" font-size="12" fill="#222" text-anchor="middle" >CHRG red</text><circle cx="650" cy="120" r="18" fill="#43A047" opacity="1"><animate attributeName="opacity" dur="14.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.85;0.86;0.97;1"/></circle><text x="650" y="162" font-size="12" fill="#222" text-anchor="middle" >STDBY green</text><rect x="720" y="70" width="420" height="200" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" /><text x="930.0" y="292" font-size="12" fill="#222" text-anchor="middle" >time</text><text x="712" y="84" font-size="12" fill="#222" text-anchor="end" >V / I</text><path d="M720,230.0 L753.6,200.0 L770.4,160.0 L846.0,134.0 L951.0,114.0 L1014.0,114.0 L1140,114.0" fill="none" stroke="#1E88E5" stroke-width="4" stroke-dasharray="900" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="900;0;0;900" keyTimes="0;0.9;0.97;1" dur="14.0s" repeatCount="indefinite"/></path><text x="1136" y="102.0" font-size="12" fill="#1E88E5" text-anchor="end" font-weight="700" >cell voltage</text><path d="M720,246.0 L770.4,246.0 L774.6,110.0 L951.0,110.0 L1014.0,180.0 L1077.0,250.0 L1140,260.0" fill="none" stroke="#EF6C00" stroke-width="4" stroke-dasharray="900" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="900;0;0;900" keyTimes="0;0.9;0.97;1" dur="14.0s" repeatCount="indefinite"/></path><text x="1136" y="254.0" font-size="12" fill="#EF6C00" text-anchor="end" font-weight="700" >charge current</text><text x="600" y="370" font-size="13" fill="#222" text-anchor="middle" >Charge with the main switch OFF. The MT3608 never charges the cell; only the TP4056 does.</text></svg>
