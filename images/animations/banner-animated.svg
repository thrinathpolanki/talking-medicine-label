<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" font-family="Helvetica, Arial, sans-serif"><title>Talking Medicine Label animated banner</title><desc>Navy banner with the project title, pulsing NFC rings and a moving highlight bar. Decorative; not a photograph of the hardware.</desc><rect width="1200" height="280" fill="#0B2545"/><text x="60" y="110" font-size="54" fill="#fff" text-anchor="start" font-weight="700">Talking Medicine Label</text><text x="60" y="158" font-size="22" fill="#bfe9e5" text-anchor="start">An IoT-based assistive medicine information and audio system</text><text x="60" y="190" font-size="22" fill="#bfe9e5" text-anchor="start">for visually impaired people</text><text x="60" y="238" font-size="16" fill="#fff" text-anchor="start">ESP32 / PN532 NFC / DFPlayer Mini / PAM8403 - Community Service Project (CSP)</text><circle cx="1000" cy="140" r="10" fill="none" stroke="#13A89E" stroke-width="3"><animate attributeName="r" values="10;95" dur="3.0s" begin="0.00s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="3.0s" begin="0.00s" repeatCount="indefinite"/></circle><circle cx="1000" cy="140" r="10" fill="none" stroke="#13A89E" stroke-width="3"><animate attributeName="r" values="10;95" dur="3.0s" begin="0.75s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="3.0s" begin="0.75s" repeatCount="indefinite"/></circle><circle cx="1000" cy="140" r="10" fill="none" stroke="#13A89E" stroke-width="3"><animate attributeName="r" values="10;95" dur="3.0s" begin="1.50s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="3.0s" begin="1.50s" repeatCount="indefinite"/></circle><circle cx="1000" cy="140" r="10" fill="none" stroke="#13A89E" stroke-width="3"><animate attributeName="r" values="10;95" dur="3.0s" begin="2.25s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="3.0s" begin="2.25s" repeatCount="indefinite"/></circle><rect x="982" y="122" width="22" height="36" rx="4" fill="#fff"/><path d="M1004 122 l24 -16 v68 l-24 -16z" fill="#fff"/><rect x="0" y="268" width="1200" height="12" fill="#13A89E"/><rect x="0" y="268" width="240" height="12" fill="#fff" opacity="0.7"><animate attributeName="x" values="-240;1200" dur="4s" repeatCount="indefinite"/></rect></svg>
