<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" font-family="Helvetica, Arial, sans-serif"><title>MT3608 adjustment animation</title><desc>The trimmer rotates while the multimeter reading climbs from 3.70 V to 5.00 V, then a stop message appears.</desc><rect width="1200" height="410" fill="#fff"/><text x="600" y="34" font-size="20" fill="#0B2545" text-anchor="middle" font-weight="700" >Setting the MT3608 to 5.0 V before connecting anything</text><rect x="60" y="70" width="420" height="260" rx="14" fill="#1565C0" stroke="#0B2545" stroke-width="4" /><text x="270" y="100" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >MT3608 (output unconnected)</text><rect x="100" y="130" width="120" height="120" rx="10" fill="#1E88E5" stroke="#fff" stroke-width="3" /><g transform="translate(160,190)"><g><circle r="40" fill="#FFD54F" stroke="#333" stroke-width="3"/><line x1="-30" y1="0" x2="30" y2="0" stroke="#333" stroke-width="7" stroke-linecap="round"/><animateTransform attributeName="transform" type="rotate" values="0;540;540;0" keyTimes="0;0.7;0.95;1" dur="12s" repeatCount="indefinite"/></g></g><text x="160" y="275" font-size="12" fill="#fff" text-anchor="middle" >trimmer</text><text x="380" y="170" font-size="13" fill="#fff" text-anchor="middle" >VIN+ / VIN-</text><text x="380" y="200" font-size="12" fill="#bfe9e5" text-anchor="middle" >from TP4056 via switch</text><text x="380" y="260" font-size="13" fill="#fff" text-anchor="middle" >OUT+ / OUT-</text><text x="380" y="288" font-size="12" fill="#bfe9e5" text-anchor="middle" >to the multimeter</text><rect x="600" y="70" width="360" height="260" rx="16" fill="#212121" stroke="#555" stroke-width="4" /><rect x="630" y="100" width="300" height="100" rx="6" fill="#B2D8B2" stroke="#333" stroke-width="3" /><g opacity="0"><text x="780" y="172" font-size="52" fill="#1B5E20" text-anchor="middle" font-weight="700" >3.70 V</text><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0120;0.1600;0.1720;1"/></g><g opacity="0"><text x="780" y="172" font-size="52" fill="#1B5E20" text-anchor="middle" font-weight="700" >4.10 V</text><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1600;0.1720;0.3200;0.3320;1"/></g><g opacity="0"><text x="780" y="172" font-size="52" fill="#1B5E20" text-anchor="middle" font-weight="700" >4.55 V</text><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3200;0.3320;0.4800;0.4920;1"/></g><g opacity="0"><text x="780" y="172" font-size="52" fill="#1B5E20" text-anchor="middle" font-weight="700" >4.90 V</text><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4800;0.4920;0.6200;0.6320;1"/></g><g opacity="1"><text x="780" y="172" font-size="52" fill="#1B5E20" text-anchor="middle" font-weight="700" >5.00 V</text><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6200;0.6320;0.9700;0.9820;1"/></g><text x="780" y="235" font-size="13" fill="#ddd" text-anchor="middle" >multimeter, DC volts</text><text x="780" y="265" font-size="12" fill="#aaa" text-anchor="middle" >probes on OUT+ and OUT-</text><g opacity="1"><rect x="630" y="280" width="300" height="34" rx="8" fill="#2E7D32" stroke="none" stroke-width="0" /><text x="780" y="303" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" >5.00 V: stop turning, switch OFF</text><animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6400;0.6520;0.9700;0.9820;1"/></g><text x="600" y="370" font-size="13" fill="#222" text-anchor="middle" >Turn slowly and watch the meter. The turning direction differs between modules; the meter is the only reference.</text><text x="600" y="392" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="700" >Never assume the factory setting is 5 V: it may be well above and would destroy the other modules.</text></svg>
